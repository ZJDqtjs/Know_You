<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">End-to-End Dialect Speech Recognition Model Architecture</text>

  <!-- Input Section -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="60" y="35" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">Audio Input</text>
    <text x="60" y="55" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#666">(Dialect/Accent)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M170 140 L220 140" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Audio Encoder -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="80" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Audio Encoder</text>
    <rect x="20" y="50" width="120" height="20" rx="5" fill="#ffe0b2"/>
    <text x="80" y="65" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Fbank Extraction</text>
    <rect x="20" y="80" width="120" height="20" rx="5" fill="#ffe0b2"/>
    <text x="80" y="95" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Temporal Modeling</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M380 140 L430 140" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Audio Adaptor -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="70" y="35" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Audio Adaptor</text>
    <text x="70" y="55" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Cross-modal Align</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M570 140 L620 140" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM Section -->
  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="140" height="160" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">LLM</text>
    <text x="70" y="50" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Text Generation</text>
    
    <!-- Inputs to LLM -->
    <rect x="20" y="70" width="100" height="20" rx="5" fill="#e1bee7"/>
    <text x="70" y="85" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">Prompt Inst.</text>
    <rect x="20" y="95" width="100" height="20" rx="5" fill="#e1bee7"/>
    <text x="70" y="110" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">Audio Embeds</text>
    <rect x="20" y="120" width="100" height="20" rx="5" fill="#e1bee7"/>
    <text x="70" y="135" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">Hotwords</text>
  </g>

  <!-- Bottom: Processing Flow -->
  <g transform="translate(50, 260)">
    <!-- Legend/Explanation box -->
    <rect x="0" y="0" width="710" height="180" rx="10" fill="white" stroke="#ccc" stroke-dasharray="5,5"/>
    <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">Core Processing Pipeline:</text>
    
    <g transform="translate(40, 50)">
      <circle cx="15" cy="15" r="15" fill="#2196f3"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-weight="bold">1</text>
      <text x="40" y="20" font-family="sans-serif" font-size="14">Signal: Audio → Fbank Features</text>
    </g>

    <g transform="translate(40, 90)">
      <circle cx="15" cy="15" r="15" fill="#ff9800"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-weight="bold">2</text>
      <text x="40" y="20" font-family="sans-serif" font-size="14">Encode: Acoustic Features → High-level Representation</text>
    </g>

    <g transform="translate(40, 130)">
      <circle cx="15" cy="15" r="15" fill="#4caf50"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-weight="bold">3</text>
      <text x="40" y="20" font-family="sans-serif" font-size="14">Bridge: Align dimensions to LLM embedding space</text>
    </g>

    <g transform="translate(400, 50)">
      <circle cx="15" cy="15" r="15" fill="#9c27b0"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-weight="bold">4</text>
      <text x="40" y="20" font-family="sans-serif" font-size="14">Generate: Context + Audio + Instruction → Text</text>
    </g>

    <g transform="translate(400, 90)">
      <circle cx="15" cy="15" r="15" fill="#607d8b"/>
      <text x="15" y="20" text-anchor="middle" fill="white" font-weight="bold">5</text>
      <text x="40" y="20" font-family="sans-serif" font-size="14">Optimize: CTC Loss + Hotwords + ITN Norm</text>
    </g>
  </g>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666" />
    </marker>
  </defs>
</svg>