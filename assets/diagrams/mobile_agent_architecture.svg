<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#fcfcfc" />

  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Multimodal Mobile Agent - Closed Loop Architecture</text>

  <!-- Center: LLM (Brain) -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="200" height="150" rx="15" fill="#e8eaf6" stroke="#3f51b5" stroke-width="3"/>
    <text x="100" y="40" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a237e">Multimodal Agent</text>
    <text x="100" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">VLM / LLM Core</text>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#9fa8da" stroke-width="1"/>
    <text x="100" y="115" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Image Understanding</text>
    <text x="100" y="135" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">Logic &amp; Planning</text>
  </g>

  <!-- Top: Input/Perception -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
    <text x="100" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#004d40">Perception Layer</text>
    <text x="100" y="50" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#00695c">Screenshot + App Context</text>
    <text x="100" y="65" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#00695c">User Instruction (Voice/Text)</text>
  </g>

  <!-- Bottom: Output/Decision -->
  <g transform="translate(300, 420)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#fff3e0" stroke="#ff5722" stroke-width="2"/>
    <text x="100" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">Decision Layer</text>
    <text x="100" y="50" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#d84315">Action DSL Generation</text>
    <text x="100" y="65" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#d84315">{ Tap, Swipe, Type... }</text>
  </g>

  <!-- Left: Mobile Device -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="120" height="250" rx="15" fill="#eceff1" stroke="#455a64" stroke-width="4"/>
    <rect x="10" y="20" width="100" height="200" fill="#fff" stroke="#cfd8dc"/>
    <text x="60" y="125" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#90a4ae">Device</text>
    <text x="60" y="240" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#455a64">Android / iOS / Harmony</text>
  </g>

  <!-- Right: Execution Engine -->
  <g transform="translate(630, 200)">
    <rect x="0" y="0" width="140" height="150" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">Execution</text>
    <line x1="10" y1="50" x2="130" y2="50" stroke="#ffab91"/>
    <text x="70" y="70" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333">Coord Mapping</text>
    <text x="70" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333">Safety Check</text>
    <text x="70" y="110" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333">ADB/WDA Cmds</text>
    <text x="70" y="130" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333">Human Takeover</text>
  </g>

  <!-- Connections / Arrows -->
  
  <!-- Device -> Perception -->
  <path d="M110 150 L300 90" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="180" y="110" font-family="sans-serif" font-size="10" fill="#455a64" transform="rotate(-15 180,110)">Capture State</text>

  <!-- Perception -> LLM -->
  <path d="M400 130 L400 200" stroke="#009688" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="170" font-family="sans-serif" font-size="11" fill="#00695c">Multimodal Prompt</text>

  <!-- LLM -> Decision -->
  <path d="M400 350 L400 420" stroke="#3f51b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="390" font-family="sans-serif" font-size="11" fill="#283593">Inference</text>

  <!-- Decision -> Execution -->
  <path d="M500 460 L700 460 L700 350" fill="none" stroke="#ff5722" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="480" font-family="sans-serif" font-size="11" fill="#d84315">Srtuctured Action</text>

  <!-- Execution -> Device (Feedback Loop) -->
  <path d="M630 275 L520 275 L520 540 L110 540 L110 400" fill="none" stroke="#d84315" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="300" y="530" font-family="sans-serif" font-size="11" fill="#d84315">Perform Action (Tap/Swipe)</text>

  <!-- Legend -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
  </defs>

</svg>