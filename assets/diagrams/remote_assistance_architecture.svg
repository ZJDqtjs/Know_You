<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f4f5f7" />

  <!-- Title -->
  <text x="400" y="30" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">P2P Remote Assistance Architecture</text>

  <!-- Left: Assistant (Child/Helper) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="300" rx="10" fill="#ddeeff" stroke="#2196f3" stroke-width="2"/>
    <text x="90" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">Assistant (Viewer)</text>
    
    <!-- Components -->
    <rect x="20" y="60" width="140" height="40" fill="#fff" stroke="#90caf9"/>
    <text x="90" y="85" font-family="sans-serif" font-size="12" text-anchor="middle">Gesture Capture</text>

    <rect x="20" y="120" width="140" height="100" fill="#212121"/>
    <text x="90" y="175" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#fff">Video Render</text>
    
    <rect x="20" y="240" width="140" height="40" fill="#fff" stroke="#90caf9"/>
    <text x="90" y="265" font-family="sans-serif" font-size="12" text-anchor="middle">WebRTC Client</text>
  </g>

  <!-- Right: Elder (Host/Sharer) -->
  <g transform="translate(570, 100)">
    <rect x="0" y="0" width="180" height="300" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="90" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">Elder (Sharer)</text>

    <!-- Components -->
    <rect x="20" y="60" width="140" height="40" fill="#fff" stroke="#ffcc80"/>
    <text x="90" y="85" font-family="sans-serif" font-size="12" text-anchor="middle">Screen Capture</text>

    <rect x="20" y="120" width="140" height="40" fill="#fff" stroke="#ffcc80"/>
    <text x="90" y="145" font-family="sans-serif" font-size="12" text-anchor="middle">Action Executor</text>
    <text x="90" y="155" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#555">(Accessibility Service)</text>

    <rect x="20" y="240" width="140" height="40" fill="#fff" stroke="#ffcc80"/>
    <text x="90" y="265" font-family="sans-serif" font-size="12" text-anchor="middle">WebRTC Server</text>
  </g>

  <!-- Middle: Cloud/Network -->
  <g transform="translate(300, 50)">
    <ellipse cx="100" cy="60" rx="80" ry="40" fill="#e0e0e0" stroke="#9e9e9e" stroke-dasharray="5,5"/>
    <text x="100" y="55" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#616161">Signaling Server</text>
    <text x="100" y="75" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#757575">WebSocket / STUN</text>
  </g>

  <!-- Data Flows -->

  <!-- Signaling -->
  <path d="M140 100 L250 80" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M570 100 L380 80" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="400" y="120" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#757575">Session Setup (SDP)</text>

  <!-- Video Stream -->
  <path d="M570 280 L238 280" stroke="#f44336" stroke-width="4" fill="none"/>
  <polygon points="248,280 238,272 238,288" fill="#f44336" />
  
  <text x="400" y="270" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d32f2f">Video Stream (P2P)</text>
  <text x="400" y="295" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#d32f2f">H.264 / VP9</text>

  <!-- Control Stream -->
  <path d="M230 200 L562 240" stroke="#4caf50" stroke-width="3" fill="none"/>
  <polygon points="570,240 560,234 560,246" fill="#4caf50" />
  
  <text x="400" y="230" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">Control Commands</text>
  <text x="400" y="245" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32">{ x: 0.5, y: 0.2, action: 'tap' }</text>

  <!-- Markers (Removed for compatibility) -->

</svg>