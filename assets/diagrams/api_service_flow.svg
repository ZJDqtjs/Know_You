<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#eef2f3" />

  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#37474f">API Service Flow: FastAPI + SSE</text>

  <!-- Client -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="120" height="200" rx="10" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
    <text x="60" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#263238">Client</text>
    <text x="60" y="50" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#37474f">App / Web</text>
    
    <!-- Request Out -->
    <path d="M120 80 L300 80" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="70" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#263238">POST /run_task</text>
    <text x="210" y="100" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#546e7a">{"task": "clean cache"}</text>

    <!-- SSE In -->
    <path d="M300 180 L120 180" stroke="#009688" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="210" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#00796b">SSE: event stream</text>
    
    <!-- Final Response In -->
    <path d="M300 280 L120 280" stroke="#009688" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="270" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#00796b">Final Result</text>
  </g>

  <!-- Server Boundary -->
  <rect x="300" y="50" width="450" height="400" rx="15" fill="#fff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="525" y="480" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#90a4ae">Server Infra</text>

  <!-- FastAPI -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="140" height="340" rx="10" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00695c">FastAPI</text>
    
    <text x="70" y="60" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#004d40">Auth / Val</text>
    <rect x="20" y="80" width="100" height="200" fill="#fff" stroke="#80cbc4"/>
    <text x="70" y="100" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#004d40">Async Runner</text>
  </g>

  <!-- Model Engine -->
  <g transform="translate(560, 150)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ede7f6" stroke="#673ab7" stroke-width="2"/>
    <text x="80" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4527a0">Model Engine</text>
    <text x="80" y="50" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#512da8">Step-by-step Loop</text>

    <!-- Loop -->
    <path d="M120 60 A 20 20 0 1 1 120 100 A 20 20 0 1 1 120 60" fill="none" stroke="#673ab7" stroke-width="2"/>
  </g>

  <!-- Flows inside server -->
  <path d="M420 120 L560 180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="150" font-family="sans-serif" font-size="10" fill="#333">Invoke Task</text>

  <path d="M560 210 L420 250" stroke="#009688" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="490" y="230" font-family="sans-serif" font-size="10" fill="#00796b" text-anchor="middle">Step Event</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>