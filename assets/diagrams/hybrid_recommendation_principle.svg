<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860">
  <!-- Background -->
  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="44" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#263238">Hybrid Recommendation Principle (Posts + Products)</text>
  <text x="600" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#546e7a">Profile cache + event-driven updates + CF / Content / Knowledge fusion (with Hot fallback)</text>

  <!-- Layout shift: move main diagram down to avoid overlap with the title -->
  <g transform="translate(0,90)">

  <!-- Section headers -->
  <text x="135" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#37474f">A. Data &amp; Events</text>
  <text x="510" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#37474f">B. User Profile (cache + rebuild)</text>
  <text x="880" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#37474f">C. Scoring &amp; Fusion</text>

  <!-- A1: Online request -->
  <g transform="translate(40,130)">
    <rect x="0" y="0" width="300" height="110" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="150" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Recommendation API</text>
    <text x="150" y="50" font-family="monospace" font-size="11" text-anchor="middle" fill="#0d47a1">GET /api/v1/recommendations/posts</text>
    <text x="150" y="68" font-family="monospace" font-size="11" text-anchor="middle" fill="#0d47a1">GET /api/v1/recommendations/products</text>
    <text x="150" y="92" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1565c0">controller: getRecommendedPosts / getRecommendedProducts</text>
  </g>

  <!-- A2: Behavior events -->
  <g transform="translate(40,260)">
    <rect x="0" y="0" width="300" height="135" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
    <text x="150" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">Behavior Events</text>
    <text x="150" y="50" font-family="monospace" font-size="11" text-anchor="middle" fill="#4a148c">POST /api/v1/recommendations/events</text>
    <text x="150" y="70" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a">scene/action/targetType/targetId/keyword/tags</text>
    <text x="150" y="92" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a">service: trackUserBehavior()</text>
    <text x="150" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#6a1b9a">weights: EVENT_ACTION_WEIGHTS</text>
  </g>

  <!-- A3: Domain data sources -->
  <g transform="translate(40,415)">
    <rect x="0" y="0" width="300" height="255" rx="12" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
    <text x="150" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Domain Data (DB)</text>

    <rect x="16" y="45" width="268" height="56" rx="10" fill="#ffffff" stroke="#ffb74d"/>
    <text x="150" y="68" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5d4037">Community: posts / likes / comments</text>
    <text x="150" y="88" font-family="monospace" font-size="10" text-anchor="middle" fill="#6d4c41">CommunityPost / CommunityPostLike / CommunityComment</text>

    <rect x="16" y="111" width="268" height="56" rx="10" fill="#ffffff" stroke="#ffb74d"/>
    <text x="150" y="134" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5d4037">Mall: products / orders</text>
    <text x="150" y="154" font-family="monospace" font-size="10" text-anchor="middle" fill="#6d4c41">MallProduct / MallOrder / MallOrderItem</text>

    <rect x="16" y="177" width="268" height="56" rx="10" fill="#ffffff" stroke="#ffb74d"/>
    <text x="150" y="200" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5d4037">User &amp; Health</text>
    <text x="150" y="220" font-family="monospace" font-size="10" text-anchor="middle" fill="#6d4c41">User / HealthData</text>

    <rect x="16" y="243" width="268" height="56" rx="10" fill="#ffffff" stroke="#ffb74d"/>
    <text x="150" y="266" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#5d4037">Profile &amp; Event tables</text>
    <text x="150" y="286" font-family="monospace" font-size="10" text-anchor="middle" fill="#6d4c41">UserProfile / UserBehaviorEvent</text>
  </g>

  <!-- B1: Profile cache -->
  <g transform="translate(390,130)">
    <rect x="0" y="0" width="380" height="265" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">User Profile Cache</text>

    <rect x="18" y="45" width="344" height="70" rx="10" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="190" y="68" font-family="monospace" font-size="11" text-anchor="middle" fill="#1b5e20">ensureFreshProfile(userId)</text>
    <text x="190" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32">TTL: PROFILE_REBUILD_TTL_MS = 6h</text>

    <rect x="18" y="125" width="344" height="96" rx="10" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="190" y="150" font-family="monospace" font-size="11" text-anchor="middle" fill="#1b5e20">rebuildUserProfileFromHistory(userId)</text>
    <text x="190" y="170" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32">vectors: postVector / productVector</text>
    <text x="190" y="190" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32">keywords: keywordWeights → tags (pickTopTags)</text>
    <text x="190" y="210" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2e7d32">text features: tokenize() + STOPWORDS</text>

    <rect x="18" y="231" width="344" height="22" rx="8" fill="#c8e6c9" stroke="#66bb6a"/>
    <text x="190" y="247" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#1b5e20">stores: tags, keywordWeights, postVector, productVector, stats, lastRebuildAt</text>
  </g>

  <!-- B2: Event-driven incremental update -->
  <g transform="translate(390,415)">
    <rect x="0" y="0" width="380" height="255" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
    <text x="190" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#311b92">Incremental Update</text>

    <rect x="18" y="45" width="344" height="70" rx="10" fill="#ffffff" stroke="#b39ddb"/>
    <text x="190" y="68" font-family="monospace" font-size="11" text-anchor="middle" fill="#311b92">trackUserBehavior(userId, event)</text>
    <text x="190" y="90" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#4527a0">normalize + apply weights</text>

    <rect x="18" y="125" width="344" height="90" rx="10" fill="#ffffff" stroke="#b39ddb"/>
    <text x="190" y="148" font-family="monospace" font-size="11" text-anchor="middle" fill="#311b92">resolveEventTokens(event)</text>
    <text x="190" y="168" font-family="monospace" font-size="11" text-anchor="middle" fill="#311b92">applyEventToProfileVectors(profile, event, tokens)</text>
    <text x="190" y="190" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#4527a0">updates keywordWeights + vectors + tags + stats</text>

    <rect x="18" y="225" width="344" height="22" rx="8" fill="#d1c4e9" stroke="#7e57c2"/>
    <text x="190" y="241" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#311b92">append log: UserBehaviorEvent.create(...)</text>
  </g>

  <!-- C1: Context builders -->
  <g transform="translate(820,130)">
    <rect x="0" y="0" width="340" height="150" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="170" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Recommendation Context</text>
    <text x="170" y="55" font-family="monospace" font-size="11" text-anchor="middle" fill="#e65100">buildPostRecommendationContext(userId)</text>
    <text x="170" y="76" font-family="monospace" font-size="11" text-anchor="middle" fill="#e65100">buildProductRecommendationContext(userId)</text>
    <text x="170" y="105" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#f57c00">produces normalized score maps:</text>
    <text x="170" y="126" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#f57c00">cfScores / contentScores / knowledgeScores / hotScores</text>
  </g>

  <!-- C2: Three strategies -->
  <g transform="translate(820,295)">
    <rect x="0" y="0" width="340" height="195" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <text x="170" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#006064">Scoring Strategies</text>

    <rect x="18" y="45" width="304" height="45" rx="10" fill="#ffffff" stroke="#4dd0e1"/>
    <text x="170" y="67" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#006064">1) Collaborative Filtering</text>
    <text x="170" y="85" font-family="monospace" font-size="10" text-anchor="middle" fill="#006064">buildCfScoresFromProfiles + cosineSimilarity</text>

    <rect x="18" y="95" width="304" height="45" rx="10" fill="#ffffff" stroke="#4dd0e1"/>
    <text x="170" y="117" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#006064">2) Content-based Matching</text>
    <text x="170" y="135" font-family="monospace" font-size="10" text-anchor="middle" fill="#006064">tokenize + scoreByKeywordOverlap</text>

    <rect x="18" y="145" width="304" height="45" rx="10" fill="#ffffff" stroke="#4dd0e1"/>
    <text x="170" y="167" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#006064">3) Knowledge-based Rules</text>
    <text x="170" y="185" font-family="monospace" font-size="10" text-anchor="middle" fill="#006064">getAgeByBirthday + buildKnowledgeKeywords</text>
  </g>

  <!-- C3: Fusion + formula -->
  <g transform="translate(820,505)">
    <rect x="0" y="0" width="340" height="165" rx="12" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
    <text x="170" y="28" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#33691e">Fusion &amp; Ranking</text>

    <text x="170" y="55" font-family="monospace" font-size="11" text-anchor="middle" fill="#33691e">rankByHybridScore(candidates, resolvers, weights)</text>

    <rect x="18" y="72" width="304" height="70" rx="10" fill="#ffffff" stroke="#c5e1a5"/>
    <text x="170" y="95" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33691e">Final score (same as code)</text>
    <text x="170" y="116" font-family="monospace" font-size="10" text-anchor="middle" fill="#33691e">S = w_cf*cf + w_content*content + w_knowledge*knowledge</text>
    <text x="170" y="134" font-family="monospace" font-size="10" text-anchor="middle" fill="#33691e">if S &lt;= 0 then S = 0.5 * hot</text>

    <text x="170" y="158" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#558b2f">weights: POST_WEIGHTS / PRODUCT_WEIGHTS</text>
  </g>

  <!-- Output -->
  <g transform="translate(390,20)">
    <rect x="0" y="0" width="770" height="86" rx="12" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="385" y="26" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37474f">Outputs returned to client</text>
    <text x="385" y="48" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#455a64">list: item + recommend.score + recommend.reason + recommend.detail (cf/content/knowledge/hot)</text>
    <text x="385" y="68" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#455a64">algorithm: { type: hybrid-v1-profile-cache, weights, strategies }</text>
  </g>

  <!-- Arrows A -> B (request to profile cache) -->
  <path d="M340 185 L378 185" stroke="#607d8b" stroke-width="2"/>
  <polygon points="390,185 378,179 378,191" fill="#607d8b"/>

  <!-- Arrow A2 -> B2 (events to incremental update) -->
  <path d="M340 325 L378 510" stroke="#607d8b" stroke-width="2" fill="none"/>
  <polygon points="390,515 380,505 377,518" fill="#607d8b"/>

  <!-- Arrow B1 -> C1 (fresh profile to context) -->
  <path d="M770 220 L808 220" stroke="#607d8b" stroke-width="2"/>
  <polygon points="820,220 808,214 808,226" fill="#607d8b"/>

  <!-- Arrow C1 -> C2 -->
  <path d="M990 280 L990 295" stroke="#607d8b" stroke-width="2"/>
  <polygon points="990,295 984,283 996,283" fill="#607d8b"/>

  <!-- Arrow C2 -> C3 -->
  <path d="M990 490 L990 505" stroke="#607d8b" stroke-width="2"/>
  <polygon points="990,505 984,493 996,493" fill="#607d8b"/>

  <!-- Arrow C3 -> Outputs -->
  <path d="M990 505 L990 106" stroke="#607d8b" stroke-width="2" fill="none"/>
  <polygon points="990,106 984,118 996,118" fill="#607d8b"/>

  <!-- Arrow B2 -> B1 (incremental updates feed cache) -->
  <path d="M580 415 L580 395" stroke="#607d8b" stroke-width="2"/>
  <polygon points="580,395 574,407 586,407" fill="#607d8b"/>

  <!-- Small legend: reasons -->
  <g transform="translate(40,20)">
    <rect x="0" y="0" width="320" height="86" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
    <text x="160" y="24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#37474f">Explainability (reasons)</text>
    <text x="160" y="46" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#455a64">If cf/content/knowledge &gt; 0.2 → add label</text>
    <text x="160" y="66" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#455a64">Else → “热门补充” (hot fallback)</text>
  </g>
  </g>
</svg>
