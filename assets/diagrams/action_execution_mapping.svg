<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#fffbe7" />

  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#5d4037">Action Execution Layer: DSL to Devices</text>

  <!-- Action DSL Input -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#d7ccc8" stroke="#5d4037" stroke-width="2"/>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3e2723">Action DSL</text>
    <text x="70" y="55" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#4e342e">Type: Tap</text>
    <text x="70" y="75" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#4e342e">Pos: (0.3, 0.5)</text>
  </g>

  <!-- Arrow -->
  <path d="M190 250 L232 250" stroke="#5d4037" stroke-width="2"/>
  <polygon points="240,250 232,246 232,254" fill="#5d4037" />

  <!-- Mapping Logic -->
  <g transform="translate(240, 180)">
    <rect x="0" y="0" width="160" height="140" rx="10" fill="#ffe0b2" stroke="#ff9800" stroke-width="2"/>
    <text x="80" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Translation Core</text>
    
    <!-- Step 1 -->
    <rect x="10" y="50" width="140" height="30" fill="#fff" stroke="#ffb74d"/>
    <text x="80" y="70" font-family="sans-serif" font-size="11" text-anchor="middle">Denormalize Coords</text>
    
    <!-- Step 2 -->
    <rect x="10" y="90" width="140" height="30" fill="#fff" stroke="#ffb74d"/>
    <text x="80" y="110" font-family="sans-serif" font-size="11" text-anchor="middle">Select Protocol</text>
  </g>

  <!-- Splitter -->
  <path d="M400 250 L440 250" stroke="#5d4037" stroke-width="2"/>
  
  <!-- Top Branch -->
  <path d="M440 250 L440 100 L472 100" stroke="#5d4037" stroke-width="2" fill="none"/>
  <polygon points="480,100 472,96 472,104" fill="#5d4037" />
  
  <!-- Middle Branch -->
  <path d="M440 250 L472 250" stroke="#5d4037" stroke-width="2" fill="none"/>
  <polygon points="480,250 472,246 472,254" fill="#5d4037" />
  
  <!-- Bottom Branch -->
  <path d="M440 250 L440 400 L472 400" stroke="#5d4037" stroke-width="2" fill="none"/>
  <polygon points="480,400 472,396 472,404" fill="#5d4037" />

  <!-- Device Channels -->

  <!-- Channel 1: Android -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Android (ADB)</text>
    <text x="140" y="60" font-size="12" text-anchor="middle" font-family="monospace" fill="#1b5e20">adb shell input tap x y</text>
    <text x="140" y="80" font-size="12" text-anchor="middle" font-family="monospace" fill="#1b5e20">adb shell monkey ...</text>
  </g>

  <!-- Channel 2: Harmony -->
  <g transform="translate(480, 200)">
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">HarmonyOS (HDC)</text>
    <text x="140" y="60" font-size="12" text-anchor="middle" font-family="monospace" fill="#0d47a1">hdc shell uitest tap</text>
    <text x="140" y="80" font-size="12" text-anchor="middle" font-family="monospace" fill="#0d47a1">hdc shell aa start ...</text>
  </g>

  <!-- Channel 3: iOS -->
  <g transform="translate(480, 350)">
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="140" y="30" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7b1fa2">iOS (WDA)</text>
    <text x="140" y="60" font-size="12" text-anchor="middle" font-family="monospace" fill="#4a148c">POST /session/:id/actions</text>
    <text x="140" y="80" font-size="12" text-anchor="middle" font-family="monospace" fill="#4a148c">W3C WebDriver Protocol</text>
  </g>

</svg>